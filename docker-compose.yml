services:
  # nextjs:
  #   build: .
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - .env
  #   depends_on:
  #     - postgres

  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes: 
  postgres_data:
